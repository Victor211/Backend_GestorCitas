spring:
  application:
    name: appointment-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mandatory-file-encoding: UTF-8
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  # Timeouts del RestClient.Builder autoconfigurado por Spring Boot, usado por MetaWhatsAppClient.
  # No forman parte de las variables de entorno obligatorias: tienen un valor por defecto razonable
  # y solo necesitan sobreescribirse si hace falta.
  http:
    client:
      connect-timeout: ${WHATSAPP_CONNECT_TIMEOUT_MS:5000}ms
      read-timeout: ${WHATSAPP_READ_TIMEOUT_MS:15000}ms

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# app.jwt.expiration se expresa en MILISEGUNDOS (una sola unidad, consistente en todo el proyecto).
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  openai:
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  whatsapp:
    access-token: ${WHATSAPP_ACCESS_TOKEN}
    verify-token: ${WHATSAPP_VERIFY_TOKEN}
    app-secret: ${WHATSAPP_APP_SECRET}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION}
    base-url: ${WHATSAPP_BASE_URL}
